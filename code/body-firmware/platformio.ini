[env:wemos_d1_uno32]
platform = espressif32
board = wemos_d1_uno32
framework = arduino
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Isrc/config
    -Isrc/motor
    -Isrc/motor/constants
    -Isrc/motor/driver
    -Isrc/drivetrain
    -Isrc/drivetrain/controller
    -Isrc/imu
    -Isrc/input
    -Isrc/control
    -Isrc/util
build_unflags = -std=gnu++11
lib_deps =
    adafruit/Adafruit BNO055
    adafruit/Adafruit Unified Sensor
    adafruit/Adafruit BusIO

[env:native]
platform = native
test_build_src = false
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Itest/stubs
    -Isrc/config
    -Isrc/motor
    -Isrc/motor/constants
    -Isrc/motor/driver
    -Isrc/drivetrain
    -Isrc/drivetrain/controller
    -Isrc/imu
    -Isrc/input
    -Isrc/control
    -Isrc/util
    -DBB8_DEBUG
; FFF (Fake Function Framework) — single-header mocking library
; Usage in test files:
;   #include <fff.h>
;   DEFINE_FFF_GLOBALS;              // once per test binary
;   FAKE_VOID_FUNC(func_name, arg_types...);  // define fakes in .cpp
;   DECLARE_FAKE_VOID_FUNC(func_name, arg_types...);  // declare in headers
;   RESET_FAKE(func_name);           // reset call history in setUp()
lib_deps =
    https://github.com/meekrosoft/fff.git
    adafruit/Adafruit BNO055
