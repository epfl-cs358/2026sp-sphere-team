[env:wemos_d1_uno32]
platform = espressif32
board = wemos_d1_uno32
framework = arduino
monitor_speed = 115200
board_build.partitions = default.csv

build_src_filter = +<*> -<motor/driver/BTS7960Driver.cpp> -<motor/FIT0186Motor.h> -<main_original.cpp> -<main_blink.cpp> -<main_motor_test.cpp> -<main_imu_test.cpp> -<main_robot.cpp> -<main_webserial_test.cpp> -<input/WebSocketCommandProducer.cpp> -<network/RemoteSerial.cpp>
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Isrc/config
    -Isrc/motor
    -Isrc/motor/constants
    -Isrc/motor/driver
    -Isrc/drivetrain
    -Isrc/drivetrain/controller
    -Isrc/control
    -Isrc/util
    -Isrc/imu
    -Isrc/input
    -Isrc/network
    -DOTA_PASSWORD='"${sysenv.OTA_PASSWORD}"'
build_unflags = -std=gnu++11
lib_deps =
    adafruit/Adafruit BNO055@1.6.4
    adafruit/Adafruit Unified Sensor@1.1.15
    adafruit/Adafruit BusIO@1.17.4
    Preferences
    thijse/ArduinoLog@1.1.1
    madhephaestus/ESP32Encoder@0.12.0

[env:drivetrain_test]
extends = env:wemos_d1_uno32
build_src_filter = +<*> -<motor/driver/BTS7960Driver.cpp> -<main_original.cpp> -<main_blink.cpp> -<main_motor_test.cpp> -<main_imu_test.cpp> -<main_robot.cpp> -<main_webserial_test.cpp> -<input/WebSocketCommandProducer.cpp> -<network/RemoteSerial.cpp> -<util/sync/CommandLatch.cpp>
lib_deps =
    ${env:wemos_d1_uno32.lib_deps}
    madhephaestus/ESP32Encoder@0.12.0

[env:motor_test]
extends = env:wemos_d1_uno32
build_src_filter = +<*> -<motor/driver/BTS7960Driver.cpp> -<main_original.cpp> -<main_blink.cpp> -<main_drivetrain_test.cpp> -<main_imu_test.cpp> -<main_robot.cpp> -<main_webserial_test.cpp> -<input/WebSocketCommandProducer.cpp> -<network/RemoteSerial.cpp> -<util/sync/CommandLatch.cpp>
lib_deps =
    ${env:wemos_d1_uno32.lib_deps}
    madhephaestus/ESP32Encoder@0.12.0

[env:robot]
extends = env:wemos_d1_uno32
build_src_filter = +<*> -<motor/driver/BTS7960Driver.cpp> -<main_original.cpp> -<main_blink.cpp> -<main_drivetrain_test.cpp> -<main_motor_test.cpp> -<main_imu_test.cpp> -<main_webserial_test.cpp> -<network/RemoteSerial.cpp>
lib_deps =
    ${env:wemos_d1_uno32.lib_deps}
    madhephaestus/ESP32Encoder@0.12.0
    links2004/WebSockets@2.7.3

[env:robot_ota]
extends = env:robot
upload_protocol = espota
upload_port = bb8-robot.local
; OTA password is read from the OTA_PASSWORD environment variable so it
; isn't committed. Set it before flashing:
;   export OTA_PASSWORD='your-password'
;   pio run -e robot_ota -t upload
upload_flags =
    --auth=${sysenv.OTA_PASSWORD}

[env:native]
platform = native
test_build_src = false
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Itest/stubs
    -Itest
    -Isrc/config
    -Isrc/motor
    -Isrc/motor/constants
    -Isrc/motor/driver
    -Isrc/drivetrain
    -Isrc/drivetrain/controller
    -Isrc/imu
    -Isrc/input
    -Isrc/control
    -Isrc/util
    -Isrc/network
    -DBB8_DEBUG
; FFF (Fake Function Framework) — single-header mocking library
; Usage in test files:
;   #include <fff.h>
;   DEFINE_FFF_GLOBALS;              // once per test binary
;   FAKE_VOID_FUNC(func_name, arg_types...);  // define fakes in .cpp
;   DECLARE_FAKE_VOID_FUNC(func_name, arg_types...);  // declare in headers
;   RESET_FAKE(func_name);           // reset call history in setUp()
lib_deps =
    https://github.com/meekrosoft/fff.git
    adafruit/Adafruit BNO055
