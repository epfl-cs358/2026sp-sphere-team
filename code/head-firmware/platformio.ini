[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
lib_ldf_mode = deep+
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Isrc/config
    -Isrc/camera
    -Isrc/server
    -Isrc/wifi
    -Isrc/led
build_unflags = -std=gnu++11
lib_deps =
    esp32async/ESPAsyncWebServer
    esp32async/AsyncTCP
    https://github.com/tzapu/WiFiManager.git
    espressif/esp32-camera
    ESPmDNS

[env:native]
platform = native
test_build_src = false
test_filter = test_native/test_*
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Itest/stubs
    -Isrc/config
    -Isrc/camera
    -Isrc/server
    -Isrc/wifi
    -Isrc/led
    -DBB8_DEBUG
; FFF (Fake Function Framework) — single-header mocking library
lib_deps =
    https://github.com/meekrosoft/fff.git
