name: CI

on:
  push:
    branches: [main]
    paths: [code/**]
  pull_request:
    branches: [main]
    paths: [code/**]

defaults:
  run:
    working-directory: code

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: make setup-web
      - run: make lint
      - run: make typecheck
      - run: make test-webapp test-stream
      - run: make build-webapp build-stream

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install platformio
      - run: make build-firmware
      - run: make test-firmware
